plugins {
    id("com.android.application")
}

android {
    namespace "org.csploit.android"
    compileSdk 35

    defaultConfig {
        applicationId "org.csploit.android"
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName "2.0.0-revival"
        multiDexEnabled true
        if (System.getenv("NIGHTLY_BUILD")) {
            versionName += "+" + System.getenv("NIGHTLY_BUILD_COMMIT").substring(0, 7)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        resources {
            excludes += ["META-INF/LICENSE.txt", "META-INF/NOTICE.txt"]
        }
    }

    lint {
        if (System.getenv("NIGHTLY_BUILD")) {
            checkReleaseBuilds false
        }
        abortOnError false
    }

    signingConfigs {
        release {
            if (System.getenv("KEYSTORE_FILE") != null) {
                storeFile = file(System.getenv("KEYSTORE_FILE"))
                storePassword = System.getenv("KEYSTORE_PWD")
                keyAlias = System.getenv("KEYSTORE_ALIAS")
                keyPassword = System.getenv("KEYSTORE_ALIAS_PWD")
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField "java.util.Date", "BUILD_TIME", "new java.util.Date(" + Calendar.getInstance().getTimeInMillis() + "L)"
            buildConfigField "String", "BUILD_NAME", "\"" + (System.getenv("USER") ?: "unknown") + "\""
            minifyEnabled false
            shrinkResources false
            debuggable true
            multiDexEnabled true
        }
        release {
            buildConfigField "java.util.Date", "BUILD_TIME", "new java.util.Date(" + Calendar.getInstance().getTimeInMillis() + "L)"
            buildConfigField "String", "BUILD_NAME", "\"" + (System.getenv("USER") ?: "unknown") + "\""
            if (System.getenv("KEYSTORE_FILE") != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            multiDexEnabled true
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.15.0"
    implementation "androidx.legacy:legacy-support-v4:1.0.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.preference:preference:1.2.1"
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "org.apache.commons:commons-compress:1.26.1"
    implementation "commons-net:commons-net:3.11.1"
    implementation "com.github.zafarkhaja:java-semver:0.9.0"
    implementation "org.unbescape:unbescape:1.1.6.RELEASE"
    implementation "org.msgpack:msgpack:0.6.12"
    implementation "com.googlecode.juniversalchardet:juniversalchardet:1.0.3"
    implementation "org.tukaani:xz:1.9"
    implementation "ch.acra:acra-http:5.2.0"
    implementation "ch.acra:acra-notification:5.2.0"
    testImplementation "junit:junit:4.13.2"
}
